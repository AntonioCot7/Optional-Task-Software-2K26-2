[project]
name = "optional-task-software-2k26-2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["."]
relative_files = true
# Con source = "." el XML usa rutas del proyecto (app/orders.py, main.py), que SonarQube resuelve.
# Solo se omiten pruebas, scripts de apoyo y entornos; todo el código de aplicación se mide.
omit = ["tests/*", "scripts/*", ".venv/*", ".worktrees/*", "htmlcov/*"]

[tool.coverage.report]
show_missing = true
